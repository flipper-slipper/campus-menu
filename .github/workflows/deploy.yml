name: deploy
# Deploys the Worker (site, API and all three crons) to Cloudflare on every push to main.
# Needs repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional repo secrets, synced to the Worker when present:
#   APIFY_TOKEN, ANTHROPIC_API_KEY, WEBHOOK_SECRET, ADMIN_TOKEN, RESEND_API_KEY, DIGEST_TO
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare is not configured (forks)
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets missing; skipping deploy."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.go == 'true'
      - name: Test
        if: steps.gate.outputs.go == 'true'
        run: bun test
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with: { node-version: 22 }
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: npm install --no-audit --no-fund
      - name: Database schema and seed (idempotent)
        if: steps.gate.outputs.go == 'true'
        run: |
          npx wrangler d1 execute campus-menu --remote --file=schema.sql
          npx wrangler d1 execute campus-menu --remote --file=seed.sql
      - name: Build page
        if: steps.gate.outputs.go == 'true'
        run: node scripts/build-page.mjs > public/index.html
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          URL="https://campus-menu.$SUB.workers.dev"
          echo "Public URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          npx wrangler deploy --var "PUBLIC_URL:$URL"
      - name: Sync Worker secrets
        if: steps.gate.outputs.go == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          jq -n 'env | with_entries(select(.key|IN("APIFY_TOKEN","ANTHROPIC_API_KEY","WEBHOOK_SECRET","ADMIN_TOKEN","RESEND_API_KEY","DIGEST_TO"))) | with_entries(select(.value != ""))' > /tmp/secrets.json
          echo "Syncing: $(jq -r 'keys|join(", ")' /tmp/secrets.json)"
          if [ "$(jq length /tmp/secrets.json)" -gt 0 ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm /tmp/secrets.json
